[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edh-physical-harness"
version = "0.0.0"
description = "Embodied DeepSeek Harness physical-service contracts and provider interfaces"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["jsonschema==4.25.1", "filelock>=3.13.1,<4", "Pillow"]

[project.optional-dependencies]
catalog = ["PyYAML"]
policy = ["websockets==17.0.1"]
policy-inputs = ["numpy", "Pillow", "opencv-python-headless"]
diagnostics = ["jsonlines==4.0.0"]
recording = ["av==18.1.0", "Pillow"]
robocasa-policy = ["numpy", "Pillow", "opencv-python-headless"]
behavior-evaluation = ["jsonlines", "setproctitle==1.3.7", "psutil"]
robodojo = ["msgpack==1.1.1", "numpy", "Pillow", "psutil"]
robodojo-server = ["msgpack==1.1.1", "numpy", "Pillow", "psutil", "setproctitle==1.3.7", "scipy", "yourdfpy==0.0.60", "imageio", "imageio-ffmpeg"]

[tool.setuptools.packages.find]
where = ["src"]
