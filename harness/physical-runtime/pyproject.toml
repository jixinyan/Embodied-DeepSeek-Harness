[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edh-physical-harness"
version = "0.0.0"
description = "Embodied DeepSeek Harness physical-service contracts and provider interfaces"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["jsonschema==4.25.1"]

[project.optional-dependencies]
policy = ["websockets==17.0.1"]
recording = ["av==18.1.0", "Pillow"]
robodojo = ["msgpack==1.1.1", "numpy", "Pillow", "psutil"]
robodojo-server = ["msgpack==1.1.1", "numpy", "Pillow", "psutil", "scipy", "yourdfpy==0.0.60", "imageio", "imageio-ffmpeg"]

[tool.setuptools.packages.find]
where = ["src"]
