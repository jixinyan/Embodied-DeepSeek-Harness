name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    name: Source, installation and CPU runtime checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - name: Install pnpm (v6.1.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.19.0
      - name: Install Node.js (v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
          cache: pnpm
      - name: Install Python (v7.0.0)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.17'
      - run: mkdir -p .local/work .local/cpu-tmp .local/work/cpu-runtime
      - run: pnpm install --frozen-lockfile
        env:
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -c harness/physical-runtime/constraints.txt -e "harness/physical-runtime[policy,robodojo,recording]" --report .local/work/cpu-install-report.json
        env:
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - run: .venv/bin/python scripts/check-cpu-installation.py --install-report .local/work/cpu-install-report.json --output .local/work/cpu-installation
        env:
          CUDA_VISIBLE_DEVICES: ''
          PYTHONDONTWRITEBYTECODE: '1'
      - run: pnpm check
        env:
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Require complete installation artifacts
        run: test -s .local/work/cpu-install-report.json && test -s .local/work/cpu-installation/installation.json
      - name: Check SKILL document reads and persisted metadata
        run: pnpm test:skill-sections
        env:
          CUDA_VISIBLE_DEVICES: ''
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Check protocol-specific model request configuration
        run: pnpm exec tsx --tsconfig tsconfig.runtime.json --test --test-reporter=junit tests/runtime/model-request-options.test.ts > .local/work/cpu-runtime/model-request-options.xml
        env:
          CUDA_VISIBLE_DEVICES: ''
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Check model failure classification and cancellation admission
        run: pnpm exec tsx --tsconfig tsconfig.runtime.json --test --test-reporter=junit tests/runtime/model-failures.test.ts > .local/work/cpu-runtime/model-failures.xml
        env:
          CUDA_VISIBLE_DEVICES: ''
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Check provider-owned retry configuration
        run: pnpm exec tsx --tsconfig tsconfig.runtime.json --test --test-reporter=junit tests/runtime/model-retry-configuration.test.ts > .local/work/cpu-runtime/model-retry-configuration.xml
        env:
          CUDA_VISIBLE_DEVICES: ''
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Preserve installation provenance (v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cpu-installation-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .local/work/cpu-install-report.json
            .local/work/cpu-installation/installation.json
      - name: Check native device ownership without allocation
        run: .venv/bin/python scripts/check-native-device-owner-offline.py --output .local/work/cpu-runtime/device-owner
        env:
          CUDA_VISIBLE_DEVICES: ''
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Check watchdog threads and lifecycle without allocation
        run: .venv/bin/python scripts/check-watchdog-owner-offline.py --output .local/work/cpu-runtime/watchdog-owner
        env:
          CUDA_VISIBLE_DEVICES: ''
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Check native model retries with actual refused connections
        run: pnpm exec tsx --tsconfig tsconfig.runtime.json scripts/check-model-retry-offline.mjs --output .local/work/cpu-runtime/model-retry
        env:
          CUDA_VISIBLE_DEVICES: ''
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Check native Session resource closure without allocation
        run: .venv/bin/python scripts/check-native-session-owner-offline.py --output .local/work/cpu-runtime/session-owner
        env:
          CUDA_VISIBLE_DEVICES: ''
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Check actual Worker process transport without allocation
        run: node scripts/check-worker-transport-offline.mjs --python .venv/bin/python --output .local/work/cpu-runtime/worker-transport
        env:
          CUDA_VISIBLE_DEVICES: ''
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Check native DSH core tools without model allocation
        run: pnpm exec tsx --tsconfig tsconfig.runtime.json scripts/check-core-tools-offline.mjs --output .local/work/cpu-runtime/agent-tools
        env:
          CUDA_VISIBLE_DEVICES: ''
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Check configured task plans without native allocation
        run: pnpm exec tsx --tsconfig tsconfig.runtime.json scripts/check-task-plans-offline.mjs --output .local/work/cpu-runtime/task-plans
        env:
          CUDA_VISIBLE_DEVICES: ''
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Verify CPU evidence against the triggering source
        run: .venv/bin/python scripts/check-cpu-runtime-evidence.py --installation .local/work --runtime .local/work/cpu-runtime --source-revision "${{ github.sha }}" --output .local/work/cpu-runtime/evidence.json
      - name: Preserve CPU runtime evidence (v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cpu-runtime-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .local/work/cpu-runtime/device-owner/
            .local/work/cpu-runtime/watchdog-owner/
            .local/work/cpu-runtime/session-owner/
            .local/work/cpu-runtime/worker-transport/
            .local/work/cpu-runtime/agent-tools/
            .local/work/cpu-runtime/task-plans/
            .local/work/cpu-runtime/evidence.json
            .local/work/cpu-runtime/model-request-options.xml
            .local/work/cpu-runtime/model-failures.xml
            .local/work/cpu-runtime/model-retry/
            .local/work/cpu-runtime/model-retry-configuration.xml
  team-paths:
    name: Team file admission (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      CUDA_VISIBLE_DEVICES: ''
      TSX_TSCONFIG_PATH: tsconfig.runtime.json
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Checkout source (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - name: Install pnpm (v6.1.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.19.0
      - name: Install Node.js (v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: mkdir -p .local/work .local/cpu-tmp
      - run: pnpm install --frozen-lockfile
        env:
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Check actual roles, schemas and directory links
        run: node --import tsx scripts/check-team-paths-offline.mjs --source-revision "${{ github.sha }}" --output .local/work/team-paths
        env:
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Preserve Team file admission (v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: team-paths-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: .local/work/team-paths/
