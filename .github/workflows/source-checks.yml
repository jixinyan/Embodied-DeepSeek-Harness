name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    name: Source and installation checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - name: Install pnpm (v6.1.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.19.0
      - name: Install Node.js (v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
          cache: pnpm
      - name: Install Python (v7.0.0)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.17'
      - run: mkdir -p .local/work .local/cpu-tmp
      - run: pnpm install --frozen-lockfile
        env:
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -c harness/physical-runtime/constraints.txt -e "harness/physical-runtime[policy]" --report .local/work/cpu-install-report.json
        env:
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - run: .venv/bin/python scripts/check-cpu-installation.py --install-report .local/work/cpu-install-report.json --output .local/work/cpu-installation
        env:
          CUDA_VISIBLE_DEVICES: ''
          PYTHONDONTWRITEBYTECODE: '1'
      - run: pnpm check
        env:
          TMPDIR: ${{ github.workspace }}/.local/cpu-tmp
      - name: Require complete installation artifacts
        run: test -s .local/work/cpu-install-report.json && test -s .local/work/cpu-installation/installation.json
      - name: Preserve installation provenance (v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cpu-installation-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .local/work/cpu-install-report.json
            .local/work/cpu-installation/installation.json
