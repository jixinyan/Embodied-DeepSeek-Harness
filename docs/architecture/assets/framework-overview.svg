<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1460" viewBox="0 0 1680 1460" role="img" aria-labelledby="title desc">
<title id="title">Embodied DeepSeek Harness v1.3：Define a Team，Equip Roles with Tools</title>
<desc id="desc">用户通过 team.yaml 和 ROLE.md 定义团队和角色。DSH 按目标角色建立独立会话。角色通过明确任务消息协作，通过开放 Tool Catalog 调用规划、文件、感知、主动观察、执行、验证和经验工具。Verifier 异步监控，预算耗尽必须验证；Evolver 在 retry 后追踪成功恢复并回传 SKILL。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f5b"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
