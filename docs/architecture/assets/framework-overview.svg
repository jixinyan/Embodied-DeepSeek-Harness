<text x="80" y="1296" class="label">A  Team 是用户定义的</text>
<text x="80" y="1332" class="small muted">加入新角色、选择工具和配置协作，</text>
<text x="80" y="1362" class="small muted">不修改固定 Agent 枚举或专用 Builder。</text>
<text x="620" y="1296" class="label">B  Tools 覆盖完整工作能力</text>
<text x="620" y="1332" class="small muted">规划、感知、主动观察、策略与记忆；</text>
<text x="620" y="1362" class="small muted">实际副作用与资源决定执行方式。</text>
<text x="1160" y="1296" class="label">C  上下文独立，经验可回传</text>
<text x="1160" y="1332" class="small muted">调用方明确交接，信息不足可请求补充；</text>
<text x="1160" y="1362" class="small muted">Verifier 确认恢复成功后生成经验。</text>
<text x="48" y="1433" class="small muted">实线：配置 / 任务 / 控制    虚线：观察 / 反馈 / 经验    ·    本图描述设计，不代表所有工具与后端已实现</text>
