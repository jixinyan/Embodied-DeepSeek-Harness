<rect x="0" y="0" width="1680" height="1460" rx="0" fill="#f6f8fb" stroke="none"/>
<text x="48" y="61" class="head">EMBODIED DEEPSEEK HARNESS</text>
<text x="48" y="100" class="body">定义你的 Team，让每个 Role 带着合适的 Tools 工作</text>
<text x="1260" y="61" class="label">PROJECT SPEC  /  v1.3</text>
<text x="1260" y="97" class="small muted">设计基线 · 2026.09.07</text>
<rect x="48" y="130" width="1010" height="100" rx="16" fill="#172b43" stroke="none"/>
<text x="75" y="165" class="head" style="fill:#ffffff">01  用户定义团队</text>
<text x="75" y="202" class="body" style="fill:#dbeafe">team.yaml  +  ROLE.md  +  Tool Bindings</text>
<text x="695" y="201" class="small" style="fill:#b8d4ef">新增角色只需定义与接入</text>
<rect x="1090" y="130" width="542" height="100" rx="16" fill="#172b43" stroke="none"/>
<text x="1115" y="165" class="head" style="fill:#ffffff">用户控制面板</text>
<text x="1115" y="202" class="small" style="fill:#dbeafe">选择 Team · 指令 · Sensor · 状态与证据</text>
