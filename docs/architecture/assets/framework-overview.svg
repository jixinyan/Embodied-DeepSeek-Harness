<title id="title">Embodied DeepSeek Harness: framework overview</title>
<desc id="desc">User-defined teams and independent role sessions use open tools, physical execution, asynchronous verification and source-linked recovery skills. This diagram describes target architecture, not implemented functionality.</desc>
