<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1490" viewBox="0 0 1440 1490" role="img" aria-labelledby="title desc">
  <title id="title">Embodied DeepSeek Harness architecture</title>
  <desc id="desc">A console configures compatible Sessions and user-defined agent teams. Independent DSH role contexts use planning, perception, execution and memory tools. Learned, Astra direct and reviewed hybrid policies send actions through ActionGate to simulator or hardware adapters. Observations return to Planner; Agent and device state reach the console. Simulator cameras are recorded on the worker host. A confirmed eligible execution end triggers formal verification; Planner owns retry and Evolver records recovery for on-demand SKILL retrieval.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42607e"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#15805c"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#173451}
      .title{font-size:30px;font-weight:700}.heading{font-size:23px;font-weight:700}
      .body{font-size:19px}.small{font-size:17px;fill:#526c86}.label{font-size:16px;font-weight:700;letter-spacing:1px;fill:#2563eb}
      .line{fill:none;stroke:#42607e;stroke-width:2.3;stroke-linejoin:round;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#2563eb;stroke-width:2.3;stroke-linejoin:round;stroke-dasharray:7 5;marker-end:url(#blue)}
      .memory{fill:none;stroke:#15805c;stroke-width:2.3;stroke-linejoin:round;stroke-dasharray:7 5;marker-end:url(#green)}
    </style>
  </defs>
  <rect width="1440" height="1490" fill="#f4f8ff"/>
  <text x="44" y="56" class="title">EMBODIED DEEPSEEK HARNESS</text>
  <text x="44" y="87" class="body">Composable teams · Replaceable tools and policies · Evidence-linked experience</text>
  <rect x="44" y="112" width="890" height="126" rx="18" fill="#143b70"/>
  <text x="68" y="147" class="heading" style="fill:white">Control console / Session launcher</text>
  <text x="68" y="181" class="body" style="fill:#d9eaff">Environment · Embodiment · Execution mode · Checkpoint · Model · Team</text>
  <text x="68" y="211" class="small" style="fill:#d9eaff">Agent output · Plans / TODOs · Tool calls · Device state · Timeline</text>
  <rect x="960" y="112" width="436" height="126" rx="18" fill="#e7efff" stroke="#b8cef0"/>
  <text x="984" y="147" class="heading">User-defined team</text>
  <text x="984" y="181" class="body">team.yaml + ROLE.md + tool bindings</text>
  <text x="984" y="211" class="small">Independent contexts; explicit task briefs</text>
  <path d="M490 238V282" class="line"/><path d="M1178 238V282" class="line"/>
  <rect x="44" y="288" width="1352" height="300" rx="20" fill="#e7efff" stroke="#b8cef0"/>
  <text x="68" y="321" class="label">AGENT RUNTIME / SELECTED DEEPSEEK HARNESS IMPLEMENTATIONS</text>
  <rect x="68" y="342" width="316" height="147" rx="14" fill="white" stroke="#b8cef0"/>
  <text x="88" y="377" class="heading">Planner</text>
  <text x="88" y="408" class="body">Perception · Planning · Decisions</text>
  <text x="88" y="438" class="small">Subgoals · Retry / replan / resume</text>
  <text x="88" y="466" class="small">Images + context + agent evidence</text>
  <rect x="398" y="342" width="316" height="147" rx="14" fill="white" stroke="#b8cef0"/>
  <text x="418" y="377" class="heading">Verifier</text>
  <text x="418" y="408" class="body">Formal post-execution checks</text>
  <text x="418" y="438" class="small">Confirmed eligible end required</text>
  <text x="418" y="466" class="small">Scoped GT / sensor evidence</text>
  <rect x="728" y="342" width="316" height="147" rx="14" fill="#f0faf6" stroke="#b4dccb"/>
  <text x="748" y="377" class="heading">Evolver</text>
  <text x="748" y="408" class="body">Retry-triggered recovery tracking</text>
  <text x="748" y="438" class="small">Failed attempt + subsequent evidence</text>
  <text x="748" y="466" class="small">Verified recovery → reusable skills</text>
  <rect x="1058" y="342" width="314" height="147" rx="14" fill="white" stroke="#b8cef0"/>
  <text x="1078" y="377" class="heading">Custom roles</text>
  <text x="1078" y="408" class="body">User-defined responsibilities</text>
  <text x="1078" y="438" class="small">Role-specific prompts and tools</text>
  <text x="1078" y="466" class="small">Explicit request / reply / evidence</text>
  <path d="M226 489V516M556 489V516M886 489V516M1215 489V516" class="line"/>
  <rect x="68" y="522" width="1304" height="43" rx="9" fill="white" stroke="#b8cef0"/>
  <text x="88" y="550" class="body">DSH sessions + native tools + explicit communication + scoped task / attempt / recovery identities</text>
  <path d="M450 588V626" class="line"/>
  <rect x="960" y="620" width="436" height="122" rx="15" fill="white" stroke="#b8cef0"/>
  <text x="984" y="655" class="heading">Model adapters</text>
  <text x="984" y="687" class="body">Cloud API / Responses · Local vLLM</text>
  <text x="984" y="716" class="small">Role bindings · Images · Streamed tool calls</text>
  <path d="M1178 620V588" class="line"/>
  <rect x="44" y="632" width="890" height="110" rx="15" fill="#fff9ed" stroke="#e8d6a8"/>
  <text x="68" y="665" class="heading">Tool bindings</text>
  <text x="68" y="699" class="body">Plan / TODO / files / team · Perception / active views · Execution / checks</text>
  <text x="68" y="726" class="small">Native DSH dispatch · Explicit schemas, permissions and resource effects</text>
  <path d="M450 742V790" class="line"/>
  <rect x="44" y="796" width="890" height="414" rx="20" fill="white" stroke="#b8cef0"/>
  <text x="68" y="829" class="label">PHYSICAL RUNTIME / CLIENT–SERVER POLICY AND DEVICE BOUNDARIES</text>
  <rect x="68" y="846" width="842" height="61" rx="12" fill="#edf3ff" stroke="#b8cef0"/>
  <text x="88" y="872" class="heading">Execution worker</text>
  <text x="88" y="896" class="small">Subgoal · Observation ticket · Budgets · Pause / stop acknowledgement</text>
  <path d="M489 907V929" class="line"/>
  <rect x="68" y="935" width="262" height="76" rx="12" fill="#f4f8ff" stroke="#b8cef0"/>
  <text x="86" y="966" class="heading">Learned policy</text>
  <text x="86" y="994" class="small">π0.5 / GR00T / custom</text>
  <rect x="350" y="935" width="270" height="76" rx="12" fill="#f4f8ff" stroke="#b8cef0"/>
  <text x="368" y="966" class="heading">Astra direct</text>
  <text x="368" y="994" class="small">Grounded EEF / joint targets</text>
  <rect x="640" y="935" width="270" height="76" rx="12" fill="#f4f8ff" stroke="#b8cef0"/>
  <text x="658" y="966" class="heading">Astra hybrid</text>
  <text x="658" y="994" class="small">Review prefix / intervention</text>
  <path d="M199 1011V1025H775V1011M489 1025V1039" class="line"/>
  <rect x="68" y="1045" width="842" height="67" rx="12" fill="#143b70"/>
  <text x="88" y="1073" class="heading" style="fill:white">ActionGate — every device command</text>
  <text x="88" y="1099" class="small" style="fill:#d9eaff">Identity · Generation · Scope · Budget · Action validity · Confirmed device boundary</text>
  <path d="M489 1112V1133" class="line"/>
  <rect x="68" y="1139" width="842" height="48" rx="10" fill="#edf3ff" stroke="#b8cef0"/>
  <text x="88" y="1170" class="body">Environment / embodiment adapters — capabilities · units · frames · calibration</text>
  <rect x="960" y="796" width="436" height="180" rx="15" fill="white" stroke="#b8cef0"/>
  <text x="984" y="833" class="heading">Observations and evidence</text>
  <text x="984" y="867" class="body">Camera / RGB-D / state / events</text>
  <text x="984" y="899" class="small">Perception providers · Explicit image refs</text>
  <text x="984" y="928" class="small">Planner images · Worker-local video</text>
  <text x="984" y="956" class="small">Session scene state updated from evidence</text>
  <path d="M934 1163H947V886H960" class="feedback"/>
  <path d="M1396 886H1420V260H720V238" class="feedback"/>
  <text x="980" y="777" class="small" style="fill:#2563eb">Planner observations + console state</text>
  <rect x="960" y="1000" width="436" height="210" rx="15" fill="#f0faf6" stroke="#b4dccb"/>
  <text x="984" y="1037" class="heading">Cross-Session SKILL.md</text>
  <text x="984" y="1071" class="body">Success cues · Failure conditions</text>
  <text x="984" y="1103" class="body">Verification knowledge · Scope</text>
  <text x="984" y="1136" class="small">Publish after original-goal formal success</text>
  <text x="984" y="1165" class="small">Agentic retrieval: load relevant skills on demand</text>
  <text x="984" y="1193" class="small">Source-linked experience across embodiments</text>
  <path d="M886 342V274H1408V1057H1396" class="memory"/>
  <path d="M960 1170H947V761H850V742" class="memory"/>
  <path d="M934 870H947V605H556V588" class="feedback"/>
  <text x="68" y="779" class="small" style="fill:#2563eb">Confirmed eligible execution end → independent formal Verifier assignment</text>
  <path d="M489 1210V1244" class="line"/>
  <rect x="44" y="1250" width="890" height="82" rx="15" fill="#e7efff" stroke="#b8cef0"/>
  <text x="68" y="1285" class="heading">Simulation backends</text>
  <text x="68" y="1316" class="body">RoboDojo · BEHAVIOR-1K / R1Pro · RoboCasa · RoboTwin</text>
  <rect x="960" y="1250" width="436" height="82" rx="15" fill="#e7efff" stroke="#b8cef0"/>
  <text x="984" y="1285" class="heading">Hardware integrations</text>
  <text x="984" y="1316" class="body">Robot SDK / ROS2 / DiMOS adapters</text>
  <path d="M910 1163H1428V1347H1178V1332" class="line"/>
  <rect x="44" y="1370" width="1352" height="82" rx="15" fill="#e7efff"/>
  <text x="68" y="1401" class="body">One Session, multiple tasks · Independent role contexts · Explicit evidence · Planner-owned decisions</text>
  <text x="68" y="1431" class="small">Solid arrows: configuration / tools / controls. Dashed arrows: observations / formal checks / experience.</text>
</svg>
