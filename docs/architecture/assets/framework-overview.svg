<path d="M305 571 V641" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="340" y="620" class="label">按 Role 装配工具</text>
<rect x="48" y="645" width="1584" height="145" rx="20" fill="#fff8e9" stroke="#e9d6ab"/>
