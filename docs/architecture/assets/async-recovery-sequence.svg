<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="2250" viewBox="0 0 1960 2250" role="img" aria-labelledby="title desc"><title id="title">Embodied DeepSeek Harness 异步执行、验证与恢复经验时序</title><desc id="desc">各角色独立上下文。调用方交接任务信息，执行策略与 verifier 并行，预算耗尽必须验证。Planner 决定 retry，Evolver 在收到失败与变化资料后追踪恢复，成功验证后写入经验。</desc><defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f5b"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b43}.heading{font-size:30px;font-weight:650}.label{font-size:22px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#52667c}</style></defs>
<rect x="0" y="0" width="1960" height="2250" fill="#f6f8fb" stroke="none" rx="0"/>
<text x="48" y="65" class="heading" text-anchor="start">异步执行 → 独立验证 → 成功恢复经验</text>
<text x="48" y="103" class="body" text-anchor="start">每次新委派使用新上下文；连线表示显式任务消息、反馈或工具调用。</text>
<text x="1910" y="65" class="label" text-anchor="end">EMBODIED DEEPSEEK HARNESS</text>
<rect x="17.5" y="145" width="165" height="75" fill="#172b43" stroke="none" rx="12"/>
<text x="100" y="177" class="label" text-anchor="middle" style="fill:#ffffff">用户</text>
<text x="100" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">任务与结果</text>
<rect x="257.5" y="145" width="285" height="75" fill="#172b43" stroke="none" rx="12"/>
<text x="400" y="177" class="label" text-anchor="middle" style="fill:#ffffff">Planner</text>
<text x="400" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">重试与重规划决策</text>
<rect x="627.5" y="145" width="285" height="75" fill="#172b43" stroke="none" rx="12"/>
<text x="770" y="177" class="label" text-anchor="middle" style="fill:#ffffff">Verifier</text>
<text x="770" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">监控与正式验证</text>
<rect x="997.5" y="145" width="285" height="75" fill="#172b43" stroke="none" rx="12"/>
<text x="1140" y="177" class="label" text-anchor="middle" style="fill:#ffffff">执行服务 / 策略</text>
<text x="1140" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">动作与预算</text>
<rect x="1367.5" y="145" width="285" height="75" fill="#172b43" stroke="none" rx="12"/>
<text x="1510" y="177" class="label" text-anchor="middle" style="fill:#ffffff">Evolver</text>
<text x="1510" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">Retry 时新建</text>
<rect x="1730.0" y="145" width="220" height="75" fill="#172b43" stroke="none" rx="12"/>
<text x="1840" y="177" class="label" text-anchor="middle" style="fill:#ffffff">SKILL / 证据</text>
<text x="1840" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">存储与显式检索</text>
<rect x="48" y="245" width="1864" height="295" fill="#ffffff" stroke="#d4deea" rx="16"/>
<rect x="48" y="555" width="1864" height="395" fill="#edf4ff" stroke="#d4deea" rx="16"/>
<rect x="48" y="970" width="1864" height="345" fill="#ffffff" stroke="#d4deea" rx="16"/>
<rect x="48" y="1335" width="1864" height="805" fill="#edf8f2" stroke="#d4deea" rx="16"/>
<path d="M100 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7"/>
<path d="M400 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7"/>
<path d="M770 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7"/>
<path d="M1140 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7"/>
<path d="M1510 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7"/>
<path d="M1840 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7"/>
<rect x="66" y="251" width="1120" height="36" fill="#f6f8fb" stroke="none" rx="6"/>
<text x="80" y="275" class="label" text-anchor="start" style="fill:#334155">01  调用方交接任务，建立独立角色会话</text>
<rect x="66" y="561" width="1120" height="36" fill="#f6f8fb" stroke="none" rx="6"/>
<text x="80" y="585" class="label" text-anchor="start" style="fill:#2563eb">02  执行与监控并行；预算耗尽必须正式验证</text>
<rect x="66" y="976" width="1120" height="36" fill="#f6f8fb" stroke="none" rx="6"/>
<text x="80" y="1000" class="label" text-anchor="start" style="fill:#334155">03  上层决定 Retry，交接失败过程并启动 Evolver</text>
<rect x="66" y="1341" width="1120" height="36" fill="#f6f8fb" stroke="none" rx="6"/>
<text x="80" y="1365" class="label" text-anchor="start" style="fill:#087f5b">04  重试、监控与经验追踪并行；原目标验证成功后回传经验</text>
<path d="M100 345H400" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)"/>
<text x="250.0" y="332" class="body" text-anchor="middle" style="fill:#334155">任务与约束</text>
<path d="M400 415H770" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)"/>
<text x="585.0" y="377" class="body" text-anchor="middle" style="fill:#334155">完整任务包：目标、判据、观察入口与</text>
<text x="585.0" y="402" class="body" text-anchor="middle" style="fill:#334155">权限</text>
<path d="M400 480H1140" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)"/>
<text x="770.0" y="467" class="body" text-anchor="middle" style="fill:#334155">提交 attempt 1；返回 execution_id，决策无需阻塞</text>
<path d="M1140 665H770" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)"/>
<text x="955.0" y="652" class="body" text-anchor="middle" style="fill:#2563eb">持续提供新画面与执行事件</text>
<path d="M770 735H400" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)"/>
<text x="585.0" y="722" class="body" text-anchor="middle" style="fill:#2563eb">反馈进展、偏离或疑似完成；可暂停</text>
<path d="M1140 805H770" stroke="#b45309" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#orange)"/>
<text x="955.0" y="792" class="body" text-anchor="middle" style="fill:#b45309">预算耗尽：框架强制请求正式验证</text>
<path d="M770 870H1140" stroke="#2563eb" fill="none" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="955.0" y="857" class="body" text-anchor="middle" style="fill:#2563eb">获取终止后观察与限定 GT 检查</text>
<path d="M770 935H400" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)"/>
<text x="585.0" y="922" class="body" text-anchor="middle" style="fill:#2563eb">failed + 逐项证据</text>
<path d="M400 1080H1510" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)"/>
<text x="955.0" y="1067" class="body" text-anchor="middle" style="fill:#334155">新委派：原失败、恢复目标、本次变化、证据引用</text>
<path d="M400 1150H1140" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)"/>
<text x="770.0" y="1137" class="body" text-anchor="middle" style="fill:#334155">明确 retry，提交 attempt 2</text>
<path d="M400 1220H770" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)"/>
<text x="585.0" y="1207" class="body" text-anchor="middle" style="fill:#334155">明确更新本次 attempt 的目标与变化</text>
<path d="M1510 1295H1840" stroke="#087f5b" fill="none" stroke-width="2.5" marker-end="url(#green)"/>
<text x="1675.0" y="1282" class="body" text-anchor="middle" style="fill:#087f5b">回读明确引用的失败记录</text>
<path d="M1140 1450H770" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)"/>
<text x="955.0" y="1437" class="body" text-anchor="middle" style="fill:#2563eb">画面、运行状态与终止事件</text>
<path d="M400 1520H1510" stroke="#087f5b" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#green)"/>
<text x="955.0" y="1507" class="body" text-anchor="middle" style="fill:#087f5b">上层改变与恢复链事件</text>
<path d="M1140 1590H1510" stroke="#087f5b" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#green)"/>
<text x="1325.0" y="1577" class="body" text-anchor="middle" style="fill:#087f5b">已订阅执行记录的引用</text>
<path d="M770 1660H1140" stroke="#2563eb" fill="none" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="955.0" y="1647" class="body" text-anchor="middle" style="fill:#2563eb">正式验证原恢复目标</text>
<path d="M770 1730H400" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)"/>
<text x="585.0" y="1717" class="body" text-anchor="middle" style="fill:#2563eb">原恢复目标 passed + 证据</text>
<path d="M770 1800H1510" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)"/>
<text x="1140.0" y="1787" class="body" text-anchor="middle" style="fill:#2563eb">恢复成功，附正式 verdict 引用</text>
<path d="M1510 1870H1840" stroke="#087f5b" fill="none" stroke-width="2.5" marker-end="url(#green)"/>
<text x="1675.0" y="1832" class="body" text-anchor="middle" style="fill:#087f5b">保存有来源与适用范围的 SKILL </text>
<text x="1675.0" y="1857" class="body" text-anchor="middle" style="fill:#087f5b">版本</text>
<path d="M1510 1940H400" stroke="#087f5b" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#green)"/>
<text x="955.0" y="1927" class="body" text-anchor="middle" style="fill:#087f5b">经验摘要与 SKILL 引用</text>
<path d="M400 2070H100" stroke="#334155" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#gray)"/>
<text x="250.0" y="2032" class="body" text-anchor="middle" style="fill:#334155">任务结果、验证证据与新增经</text>
<text x="250.0" y="2057" class="body" text-anchor="middle" style="fill:#334155">验</text>
<rect x="48" y="2160" width="1864" height="58" fill="#172b43" stroke="none" rx="12"/>
<text x="74" y="2197" class="body" text-anchor="start" style="fill:#ffffff">后续任务创建全新 Agent，通过显式检索获得经验。普通成功不触发 Evolver；前置子任务成功不等于原恢复目标完成。</text>
</svg>
