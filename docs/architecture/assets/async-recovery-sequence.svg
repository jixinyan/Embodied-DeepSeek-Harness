<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="2250" viewBox="0 0 1960 2250" role="img" aria-labelledby="title desc"><title id="title">Embodied DeepSeek Harness: asynchronous recovery sequence</title><desc id="desc">Planner delegates explicit briefs. Execution and monitoring overlap. Budget expiry forces verification. An explicit retry starts Evolver; original-goal success enables skill storage and return.</desc><defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155" /></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb" /></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f5b" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309" /></marker>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b43}.heading{font-size:30px;font-weight:650}.label{font-size:22px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#52667c}</style></defs>
<rect x="0" y="0" width="1960" height="2250" fill="#f6f8fb" stroke="none" rx="0" />
<text x="48" y="65" class="heading" text-anchor="start">Async execution → verification → recovery skills</text>
<text x="48" y="103" class="body" text-anchor="start">Each new delegation starts fresh; arrows are explicit task messages, feedback or tool calls.</text>
<text x="1910" y="65" class="label" text-anchor="end">EMBODIED DEEPSEEK HARNESS</text>
<rect x="17.5" y="145" width="165" height="75" fill="#172b43" stroke="none" rx="12" />
<text x="100" y="177" class="label" text-anchor="middle" style="fill:#ffffff">User</text>
<text x="100" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">Tasks and results</text>
<rect x="257.5" y="145" width="285" height="75" fill="#172b43" stroke="none" rx="12" />
<text x="400" y="177" class="label" text-anchor="middle" style="fill:#ffffff">Planner</text>
<text x="400" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">Retry / replan owner</text>
<rect x="627.5" y="145" width="285" height="75" fill="#172b43" stroke="none" rx="12" />
<text x="770" y="177" class="label" text-anchor="middle" style="fill:#ffffff">Verifier</text>
<text x="770" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">Monitor and final checks</text>
<rect x="997.5" y="145" width="285" height="75" fill="#172b43" stroke="none" rx="12" />
<text x="1140" y="177" class="label" text-anchor="middle" style="fill:#ffffff">Execution / policy</text>
<text x="1140" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">Actions and budgets</text>
<rect x="1367.5" y="145" width="285" height="75" fill="#172b43" stroke="none" rx="12" />
<text x="1510" y="177" class="label" text-anchor="middle" style="fill:#ffffff">Evolver</text>
<text x="1510" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">Created on retry</text>
<rect x="1730.0" y="145" width="220" height="75" fill="#172b43" stroke="none" rx="12" />
<text x="1840" y="177" class="label" text-anchor="middle" style="fill:#ffffff">SKILL / evidence</text>
<text x="1840" y="204" class="small" text-anchor="middle" style="fill:#c9ddf4">Store and retrieve</text>
<rect x="48" y="245" width="1864" height="295" fill="#ffffff" stroke="#d4deea" rx="16" />
<rect x="48" y="555" width="1864" height="395" fill="#edf4ff" stroke="#d4deea" rx="16" />
<rect x="48" y="970" width="1864" height="345" fill="#ffffff" stroke="#d4deea" rx="16" />
<rect x="48" y="1335" width="1864" height="805" fill="#edf8f2" stroke="#d4deea" rx="16" />
<path d="M100 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7" />
<path d="M400 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7" />
<path d="M770 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7" />
<path d="M1140 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7" />
<path d="M1510 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7" />
<path d="M1840 222V2120" fill="none" stroke="#bdcad9" stroke-width="1.5" stroke-dasharray="6 7" />
<rect x="66" y="251" width="1120" height="36" fill="#f6f8fb" stroke="none" rx="6" />
<text x="80" y="275" class="label" text-anchor="start" style="fill:#334155">01  Hand off the task and create independent role sessions</text>
<rect x="66" y="561" width="1120" height="36" fill="#f6f8fb" stroke="none" rx="6" />
<text x="80" y="585" class="label" text-anchor="start" style="fill:#2563eb">02  Execute and monitor concurrently; budget expiry requires formal verification</text>
<rect x="66" y="976" width="1120" height="36" fill="#f6f8fb" stroke="none" rx="6" />
<text x="80" y="1000" class="label" text-anchor="start" style="fill:#334155">03  Planner chooses retry, hands off failure context and starts Evolver</text>
<rect x="66" y="1341" width="1120" height="36" fill="#f6f8fb" stroke="none" rx="6" />
<text x="80" y="1365" class="label" text-anchor="start" style="fill:#087f5b">04  Retry, monitor and track recovery; return skills after original-goal verification</text>
<path d="M100 345H400" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)" />
<text x="250.0" y="332" class="body" text-anchor="middle" style="fill:#334155">Task + constraints</text>
<path d="M400 415H770" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)" />
<text x="585.0" y="377" class="body" text-anchor="middle" style="fill:#334155">Complete brief: goal, checks,</text>
<text x="585.0" y="402" class="body" text-anchor="middle" style="fill:#334155">observation access and permissions</text>
<path d="M400 480H1140" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)" />
<text x="770.0" y="467" class="body" text-anchor="middle" style="fill:#334155">Submit attempt 1; return execution_id without blocking Planner</text>
<path d="M1140 665H770" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)" />
<text x="955.0" y="652" class="body" text-anchor="middle" style="fill:#2563eb">Frames + execution events</text>
<path d="M770 735H400" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)" />
<text x="585.0" y="722" class="body" text-anchor="middle" style="fill:#2563eb">Progress / deviation; may pause</text>
<path d="M1140 805H770" stroke="#b45309" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#orange)" />
<text x="955.0" y="792" class="body" text-anchor="middle" style="fill:#b45309">Budget spent → formal check</text>
<path d="M770 870H1140" stroke="#2563eb" fill="none" stroke-width="2.5" marker-end="url(#blue)" />
<text x="955.0" y="857" class="body" text-anchor="middle" style="fill:#2563eb">Post-stop frames + GT checks</text>
<path d="M770 935H400" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)" />
<text x="585.0" y="922" class="body" text-anchor="middle" style="fill:#2563eb">failed + per-check evidence</text>
<path d="M400 1080H1510" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)" />
<text x="955.0" y="1067" class="body" text-anchor="middle" style="fill:#334155">Fresh brief: original failure, recovery goal, changes and evidence references</text>
<path d="M400 1150H1140" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)" />
<text x="770.0" y="1137" class="body" text-anchor="middle" style="fill:#334155">Explicit retry: submit attempt 2</text>
<path d="M400 1220H770" stroke="#334155" fill="none" stroke-width="2.5" marker-end="url(#gray)" />
<text x="585.0" y="1207" class="body" text-anchor="middle" style="fill:#334155">Update attempt goal and changes</text>
<path d="M1510 1295H1840" stroke="#087f5b" fill="none" stroke-width="2.5" marker-end="url(#green)" />
<text x="1675.0" y="1282" class="body" text-anchor="middle" style="fill:#087f5b">Read referenced failure records</text>
<path d="M1140 1450H770" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)" />
<text x="955.0" y="1437" class="body" text-anchor="middle" style="fill:#2563eb">Frames, state and end events</text>
<path d="M400 1520H1510" stroke="#087f5b" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#green)" />
<text x="955.0" y="1507" class="body" text-anchor="middle" style="fill:#087f5b">Upper-level changes + recovery events</text>
<path d="M1140 1590H1510" stroke="#087f5b" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#green)" />
<text x="1325.0" y="1577" class="body" text-anchor="middle" style="fill:#087f5b">Subscribed execution references</text>
<path d="M770 1660H1140" stroke="#2563eb" fill="none" stroke-width="2.5" marker-end="url(#blue)" />
<text x="955.0" y="1647" class="body" text-anchor="middle" style="fill:#2563eb">Check original recovery goal</text>
<path d="M770 1730H400" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)" />
<text x="585.0" y="1717" class="body" text-anchor="middle" style="fill:#2563eb">Original goal passed + evidence</text>
<path d="M770 1800H1510" stroke="#2563eb" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#blue)" />
<text x="1140.0" y="1787" class="body" text-anchor="middle" style="fill:#2563eb">Recovery success + formal verdict reference</text>
<path d="M1510 1870H1840" stroke="#087f5b" fill="none" stroke-width="2.5" marker-end="url(#green)" />
<text x="1675.0" y="1832" class="body" text-anchor="middle" style="fill:#087f5b">Save sourced, scoped SKILL</text>
<text x="1675.0" y="1857" class="body" text-anchor="middle" style="fill:#087f5b">version</text>
<path d="M1510 1940H400" stroke="#087f5b" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#green)" />
<text x="955.0" y="1927" class="body" text-anchor="middle" style="fill:#087f5b">Experience summary + SKILL reference</text>
<path d="M400 2070H100" stroke="#334155" fill="none" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#gray)" />
<text x="250.0" y="2032" class="body" text-anchor="middle" style="fill:#334155">Result + verification</text>
<text x="250.0" y="2057" class="body" text-anchor="middle" style="fill:#334155">evidence + new experience</text>
<rect x="48" y="2160" width="1864" height="58" fill="#172b43" stroke="none" rx="12" />
<text x="74" y="2197" class="body" text-anchor="start" style="fill:#ffffff">New tasks retrieve skills explicitly. Ordinary success does not start Evolver; prerequisite success does not complete the original recovery goal.</text>
</svg>
