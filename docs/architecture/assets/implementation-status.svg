<text x="65" y="1278" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263a4f">Not mounted: live model provider, DSH timeout-policy plugin and disk persistence backend.</text>
<text x="65" y="1307" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#263a4f">No runnable end-to-end embodied MVP yet. Green indicates tested integration, not new EDH runtime code.</text>
<text x="44" y="1367" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263a4f">NEXT: bind Team / Role definitions onto DSH, then connect physical providers through native tools.</text>
<text x="44" y="1403" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#506176">EDH owns the product. DSH supplies the agent mechanism. EDH adds embodied behavior.</text>
