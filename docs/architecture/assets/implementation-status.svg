<text x="66" y="425" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#236447">Verified example: input 6 → native add_one tool → result 7 → next model request</text>
<text x="66" y="458" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263a4f">9 runtime tests pass. Models are scripted; tool fixtures are synthetic. No live VLM or robot.</text>
