<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc"><title id="title">EDH current capabilities and remaining implementation</title><desc id="desc">Verified DSH runtime and native tools, standalone physical contract checks, and the unimplemented embodied workflow. Nine runtime tests and 230 shared contract cases. No live model or robot is connected.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#25735b"/></marker></defs><rect width="1440" height="1440" fill="#f5f7fa"/>
