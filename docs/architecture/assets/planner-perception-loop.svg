<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" role="img" aria-labelledby="title desc">
<title id="title">Planner-owned perception, planning and decision loop</title><desc id="desc">Images return directly from perception tools to the Planner. The Planner decides tool calls and subgoals. The Verifier sends checked images and outcomes back for the Planner's next decision. Specialists are optional.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65768b"/></marker><style>text{font-family:Arial,sans-serif;fill:#1d2f45}.title{font-size:28px;font-weight:700}.heading{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#53677d}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.box{fill:white;stroke:#c4d1df;stroke-width:1.5}</style></defs>
<rect width="1180" height="660" fill="#f4f7fb"/>
<text x="36" y="48" class="title">The Planner sees, plans and decides.</text><text x="36" y="79" class="body">A ReAct-style task loop using the existing DSH runtime; other roles provide explicit evidence and assistance.</text>
<rect x="36" y="142" width="280" height="156" rx="14" class="box"/><text x="56" y="175" class="heading">Perception tools</text><text x="56" y="205" class="body">Capture · segmentation · depth</text><text x="56" y="234" class="body">Active view at Planner request</text><text x="56" y="270" class="small">Return images + evidence references</text>
<rect x="403" y="128" width="350" height="186" rx="16" fill="#e8f5ee" stroke="#92bba3" stroke-width="2"/><text x="428" y="164" class="heading">Planner / upper VLM</text><text x="428" y="197" class="body">Observe images and task context</text><text x="428" y="226" class="body">Update plan + TODOs; choose next action</text><text x="428" y="260" class="small">Owns subgoals, retry, replan and resume</text><text x="428" y="287" class="small">Specialist analysis is optional</text>
<path d="M403 182H319" class="line"/><text x="334" y="170" class="small">call</text><path d="M316 258H400" class="line"/><text x="329" y="245" class="small">images</text>
<rect x="840" y="142" width="304" height="156" rx="14" class="box"/><text x="860" y="175" class="heading">Tools / policy execution</text><text x="860" y="206" class="body">Subgoal → policy → action gate</text><text x="860" y="235" class="body">→ simulation / embodiment</text><text x="860" y="270" class="small">Budgeted jobs; gate can interrupt</text>
<path d="M753 220H837" class="line"/><text x="771" y="206" class="small">decision</text>
<rect x="840" y="395" width="304" height="155" rx="14" class="box"/><text x="860" y="429" class="heading">Verifier</text><text x="860" y="460" class="body">Checks after confirmed end</text><text x="860" y="490" class="body">Formal facts and limited GT</text><text x="860" y="521" class="small">No retry, replan or resume decisions</text>
<path d="M992 298V392" class="line"/><text x="1008" y="350" class="small">observations</text>
<path d="M840 466H576V317" class="line"/><text x="601" y="454" class="small">checked images + verdict</text>
<path d="M992 142V109H176V139" class="line"/><text x="822" y="99" class="small">new observations</text>
<rect x="36" y="395" width="414" height="155" rx="14" class="box"/><text x="56" y="429" class="heading">Optional specialists + Evolver</text><text x="56" y="460" class="body">Independent contexts; explicit briefs and evidence</text><text x="56" y="490" class="body">Recovery experience supports later decisions</text><text x="56" y="521" class="small">Neither replaces the Planner's perception or authority</text>
<path d="M450 414H486V317" class="line"/><text x="361" y="356" class="small">explicit reports / skills</text>
<text x="36" y="601" class="heading">Image availability is visible: never substitute a text summary for an available image.</text><text x="36" y="632" class="small">CPU tests exercise image routing and role authority. Real cameras, learned policies and robot task performance require separate acceptance.</text>
</svg>
